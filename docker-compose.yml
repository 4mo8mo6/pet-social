services:
  web:
    image: node:20-bookworm-slim
    container_name: pet-agent-social-web
    working_dir: /app
    command: >
      sh -c "npm install &&
      npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    env_file: ./web/.env.local
    environment:
      NEXT_PUBLIC_APP_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      API_BASE_URL: http://api:8000
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pet-agent-social-api
    command: >
      sh -c "alembic upgrade heads &&
      exec uvicorn app.main:app --host ${API_HOST:-0.0.0.0} --port ${PORT:-${API_PORT:-8000}}"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    env_file: ./api/.env
    environment:
      APP_NAME: Pet Agent Social API
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: pet_agent_social
      POSTGRES_USER: pet_agent
      POSTGRES_PASSWORD: pet_agent_password
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: pet-agent-social-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pet_agent_social
      POSTGRES_USER: pet_agent
      POSTGRES_PASSWORD: pet_agent_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  web_node_modules:
